<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON SCHOOL | برنامه کلاسی</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap');

*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#050816;
  --card:rgba(18,25,48,.78);
  --cyan:#00f5ff;
  --purple:#a855f7;
  --pink:#ff2e93;
  --green:#00ff9d;
}

body{
  font-family:'Vazirmatn',Tahoma,sans-serif;
  background:var(--bg);
  color:white;
  min-height:100vh;
  overflow-x:hidden;
}

/* BACKGROUND */
canvas{
  position:fixed;
  inset:0;
  z-index:-1;
}

.glow{
  position:fixed;
  width:450px;
  height:450px;
  border-radius:50%;
  filter:blur(150px);
  opacity:.18;
  z-index:-1;
  animation:float 9s infinite alternate;
}

.glow1{background:#00f5ff;top:-100px;left:-100px}
.glow2{background:#a855f7;bottom:-100px;right:-100px}

@keyframes float{
  from{transform:translate(0,0)}
  to{transform:translate(100px,70px)}
}

/* HEADER */
header{
  text-align:center;
  padding:65px 20px 35px;
  animation:appear 1s ease;
}

.logo{
  font-size:13px;
  letter-spacing:5px;
  color:var(--cyan);
  direction:ltr;
  text-shadow:0 0 20px var(--cyan);
}

header h1{
  font-size:clamp(32px,6vw,75px);
  font-weight:900;
  margin:15px 0;
  background:linear-gradient(90deg,#00f5ff,#a855f7,#ff2e93);
  -webkit-background-clip:text;
  color:transparent;
  background-size:200%;
  animation:gradient 4s infinite;
}

@keyframes gradient{
  0%,100%{background-position:0%}
  50%{background-position:100%}
}

header p{color:#94a3b8;font-size:14px}

.line{
  width:120px;height:3px;
  margin:25px auto;
  background:linear-gradient(90deg,var(--cyan),var(--purple));
  box-shadow:0 0 20px var(--cyan);
  border-radius:20px;
}

/* TIME */
.timebox{
  text-align:center;
  margin:10px auto 35px;
}

#clock{
  font-size:30px;
  font-weight:800;
  direction:ltr;
  color:var(--cyan);
  text-shadow:0 0 20px var(--cyan);
}

#date{color:#64748b;font-size:12px;margin-top:8px}

/* DAYS */
.days{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:12px;
  padding:0 15px;
  margin-bottom:35px;
}

.day-btn{
  padding:12px 23px;
  background:rgba(15,23,42,.8);
  border:1px solid #26334d;
  border-radius:14px;
  color:#94a3b8;
  cursor:pointer;
  font-family:inherit;
  font-weight:700;
  transition:.3s;
}

.day-btn:hover{
  border-color:var(--cyan);
  transform:translateY(-4px);
  color:white;
}

.day-btn.active{
  color:#000;
  background:var(--cyan);
  box-shadow:0 0 25px #00f5ff66;
  border-color:var(--cyan);
}

/* SCHEDULE */
.container{
  max-width:1000px;
  margin:auto;
  padding:0 20px 80px;
}

.day-title{
  text-align:center;
  font-size:25px;
  margin-bottom:30px;
  font-weight:900;
}

.schedule{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.subject{
  position:relative;
  padding:27px;
  background:var(--card);
  border:1px solid #26334d;
  border-radius:22px;
  overflow:hidden;
  backdrop-filter:blur(15px);
  transition:.4s;
  animation:cardIn .7s backwards;
}

.subject:hover{
  transform:translateY(-9px) scale(1.02);
  border-color:var(--cyan);
  box-shadow:0 15px 45px #00f5ff15;
}

.subject::before{
  content:"";
  position:absolute;
  top:0;right:0;
  width:100%;height:3px;
  background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));
}

.number{
  font-size:12px;
  color:var(--cyan);
  direction:ltr;
  text-align:right;
}

.subject h3{
  font-size:24px;
  margin:17px 0;
  font-weight:900;
}

.subject p{
  font-size:12px;
  color:#64748b;
}

.icon{
  position:absolute;
  left:22px;
  top:25px;
  font-size:35px;
  filter:drop-shadow(0 0 10px #00f5ff55);
}

.subject:nth-child(2n):hover{
  border-color:var(--purple);
}

.subject:nth-child(2n)::before{
  background:linear-gradient(90deg,var(--purple),var(--pink));
}

.subject:nth-child(3n)::before{
  background:linear-gradient(90deg,var(--green),var(--cyan));
}

footer{
  text-align:center;
  padding:30px;
  color:#475569;
  font-size:12px;
  letter-spacing:2px;
}

@keyframes appear{
  from{opacity:0;transform:translateY(-30px)}
  to{opacity:1;transform:translateY(0)}
}

@keyframes cardIn{
  from{opacity:0;transform:translateY(35px)}
  to{opacity:1;transform:translateY(0)}
}

@media(max-width:500px){
  header{padding-top:40px}
  .day-btn{padding:10px 15px;font-size:13px}
  .schedule{grid-template-columns:1fr}
}
</style>
</head>

<body>

<canvas id="particles"></canvas>
<div class="glow glow1"></div>
<div class="glow glow2"></div>

<header>
  <div class="logo">✦ NEON SCHOOL SYSTEM ✦</div>
  <h1>برنامه کلاسی من</h1>
  <p>سیستم هوشمند برنامه‌ریزی مدرسه</p>
  <div class="line"></div>
</header>

<div class="timebox">
  <div id="clock">00:00:00</div>
  <div id="date"></div>
</div>

<div class="days">
  <button class="day-btn active" onclick="showDay(0,this)">شنبه</button>
  <button class="day-btn" onclick="showDay(1,this)">یکشنبه</button>
  <button class="day-btn" onclick="showDay(2,this)">دوشنبه</button>
  <button class="day-btn" onclick="showDay(3,this)">سه‌شنبه</button>
  <button class="day-btn" onclick="showDay(4,this)">چهارشنبه</button>
</div>

<div class="container">
  <div class="day-title" id="dayTitle">شنبه | S A T U R D A Y</div>
  <div class="schedule" id="schedule"></div>
</div>

<footer>
  DESIGNED WITH ⚡ | MY SCHOOL DASHBOARD
</footer>

<script>
const data=[
  {
    day:"شنبه",
    eng:"SATURDAY",
    subjects:[
      ["نگارش","✍️"],
      ["مطالعات + علوم","🔬"],
      ["فناوری","💻"]
    ]
  },
  {
    day:"یکشنبه",
    eng:"SUNDAY",
    subjects:[
      ["ورزش","⚽"],
      ["دینی","📖"],
      ["علوم","🧪"]
    ]
  },
  {
    day:"دوشنبه",
    eng:"MONDAY",
    subjects:[
      ["مطالعات","🌍"],
      ["ادبیات","📚"],
      ["عربی","📝"]
    ]
  },
  {
    day:"سه‌شنبه",
    eng:"TUESDAY",
    subjects:[
      ["تفکر","🧠"],
      ["ریاضی","📐"],
      ["زبان","🌐"]
    ]
  },
  {
    day:"چهارشنبه",
    eng:"WEDNESDAY",
    subjects:[
      ["قرآن","☪️"],
      ["هنر","🎨"],
      ["ریاضی","📏"]
    ]
  }
];

function showDay(index,btn){
  document.querySelectorAll('.day-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');

  document.getElementById('dayTitle').innerText=
    data[index].day+" | "+data[index].eng;

  const box=document.getElementById('schedule');
  box.innerHTML="";

  data[index].subjects.forEach((s,i)=>{
    box.innerHTML+=`
      <div class="subject" style="animation-delay:${i*.15}s">
        <div class="number">CLASS 0${i+1}</div>
        <div class="icon">${s[1]}</div>
        <h3>${s[0]}</h3>
        <p>✦ برنامه اختصاصی کلاس</p>
      </div>
    `;
  });
}

function updateClock(){
  const now=new Date();

  document.getElementById("clock").innerText=
    now.toLocaleTimeString("fa-IR");

  document.getElementById("date").innerText=
    now.toLocaleDateString("fa-IR",{
      weekday:"long",
      year:"numeric",
      month:"long",
      day:"numeric"
    });
}

setInterval(updateClock,1000);
updateClock();
showDay(0,document.querySelector('.day-btn'));

/* PARTICLE ANIMATION */
const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");

let particles=[];

function resize(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}

window.addEventListener("resize",resize);
resize();

for(let i=0;i<90;i++){
  particles.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    size:Math.random()*2+0.5,
    speed:Math.random()*0.5+0.2
  });
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  particles.forEach(p=>{
    p.y-=p.speed;

    if(p.y<0){
      p.y=canvas.height;
      p.x=Math.random()*canvas.width;
    }

    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fillStyle="#00f5ff";
    ctx.shadowBlur=10;
    ctx.shadowColor="#00f5ff";
    ctx.fill();
  });

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
